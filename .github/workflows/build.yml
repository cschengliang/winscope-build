# Build AOSP Winscope without a full AOSP checkout.
# Manual: Actions -> Build Winscope -> Run workflow. Branches named after an AOSP tag
# (e.g. android-16.0.0_r4) build that tag; main builds android17-release.
name: Build Winscope

on:
  workflow_dispatch:
    inputs:
      aosp_ref:
        description: 'AOSP branch or tag (empty = this branch''s name if it is android-*, else android17-release)'
        default: ''
        required: false
  push:
    branches: [main, 'android-*']
    paths: ['scripts/**', '.github/workflows/build.yml', '.gitattributes']

permissions:
  contents: write   # publish Releases from android-* branches

concurrency:
  group: winscope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AOSP_REF: ${{ inputs.aosp_ref || (startsWith(github.ref_name, 'android-') && github.ref_name) || 'android17-release' }}
      AOSP_TOP: ${{ github.workspace }}/aosp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch AOSP sources (sparse)
        run: scripts/fetch_sources.sh "$AOSP_REF" "$AOSP_TOP"

      # Perfetto's build deps (emsdk, gn, ninja, node...) are large; cache them per perfetto revision
      - name: Perfetto revision
        id: pf
        run: echo "sha=$(git -C "$AOSP_TOP/external/perfetto" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Perfetto build deps
        uses: actions/cache@v4
        with:
          path: |
            aosp/external/perfetto/buildtools
            ~/.npm
          key: perfetto-deps-${{ env.AOSP_REF }}-${{ steps.pf.outputs.sha }}
          restore-keys: perfetto-deps-${{ env.AOSP_REF }}-

      - name: Build Winscope
        run: scripts/build_winscope.sh "$AOSP_TOP"

      - name: Package
        id: pkg
        run: |
          ref="${AOSP_REF//\//-}"
          name="winscope-${ref}-$(date -u +%Y%m%d)"
          cp "$AOSP_TOP/SOURCES.txt" scripts/run_winscope.bat "$AOSP_TOP/development/tools/winscope/dist/prod/"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # android-* branches: publish/refresh Release "winscope-<branch>" with a ready-to-run zip
      - name: Publish Release
        if: startsWith(github.ref_name, 'android-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="winscope-${GITHUB_REF_NAME}"
          dir="winscope-${GITHUB_REF_NAME}"
          zip="$RUNNER_TEMP/$dir.zip"
          cp -a "$AOSP_TOP/development/tools/winscope/dist/prod" "$RUNNER_TEMP/$dir"
          (cd "$RUNNER_TEMP" && zip -qr "$zip" "$dir")
          {
            echo "Winscope built from AOSP \`${GITHUB_REF_NAME}\` ($(date -u +%Y-%m-%d), [build log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo "**Windows**: unzip and double-click \`run_winscope.bat\` (needs Python 3). It opens Winscope in the browser; with \`adb\` on PATH it also starts \`winscope_proxy.py\` for capturing traces from a device."
            echo
            echo "**Other OS**: \`python3 -m http.server 8080\` in the unzipped folder, then open http://localhost:8080 ."
            echo
            echo "Sources:"
            echo '```'
            cat "$AOSP_TOP/SOURCES.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$zip" --target "$GITHUB_SHA" --title "Winscope ${GITHUB_REF_NAME}" \
              --notes-file "$RUNNER_TEMP/notes.md" -R "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: aosp/development/tools/winscope/dist/prod/
          if-no-files-found: error
